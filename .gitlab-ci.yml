stages:
  - release

# Este trabajo (job) se encarga de crear el Release automáticamente
crear_lanzamiento:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  rules:
    # Solo se ejecuta si subes un tag que empiece con "v" (ej. v1.0.0)
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+.*$/
  script:
    - echo "Iniciando proceso de Release para la versión $CI_COMMIT_TAG"
  release:
    name: 'Release $CI_COMMIT_TAG'
    # Por ahora, pondremos un mensaje genérico apuntando al changelog.
    description: '🎉 Lanzamiento oficial de **Yuuna WebUI $CI_COMMIT_TAG**. Por favor, revisa el archivo `CHANGELOG.md` en el código fuente para ver la lista completa de cambios y novedades.'
    tag_name: '$CI_COMMIT_TAG'
    ref: '$CI_COMMIT_SHA'
