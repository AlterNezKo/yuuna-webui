stages:
  - release

crear_lanzamiento:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+.*$/
  script:
    - 'echo "Iniciando proceso de Release para la versión $CI_COMMIT_TAG"'
    - 'HASH=$(sha256sum scripts/deploy.sh | awk "{print \$1}")'
    - 'echo "SHA256_DEPLOY_SH=$HASH"'
    - 'printf "🎉 Lanzamiento oficial de **Yuuna WebUI %s**.\n\nPor favor, revisa el archivo [\`CHANGELOG.md\`](%s/-/blob/%s/CHANGELOG.md) para ver la lista completa de cambios y novedades.\n\n---\n\n### 🔐 Verificación de Integridad (SHA-256)\nHash oficial de \`scripts/deploy.sh\` (\`yuuna-ui\`) para la versión **%s**:\n\`\`\`text\n%s  deploy.sh\n\`\`\`\n\n**Instalación verificando el hash manualmente (opcional):**\n\`\`\`bash\ncurl -fsSLO %s/-/raw/%s/scripts/deploy.sh\necho \"%s  deploy.sh\" | sha256sum -c - && bash deploy.sh\n\`\`\`\n" "$CI_COMMIT_TAG" "$CI_PROJECT_URL" "$CI_COMMIT_TAG" "$CI_COMMIT_TAG" "$HASH" "$CI_PROJECT_URL" "$CI_COMMIT_TAG" "$HASH" > release_notes.md'
  release:
    name: 'Yuuna WebUI $CI_COMMIT_TAG'
    description: './release_notes.md'
    tag_name: '$CI_COMMIT_TAG'
    ref: '$CI_COMMIT_SHA'
    assets:
      links:
        - name: 'yuuna-ui.sh (deploy.sh $CI_COMMIT_TAG)'
          url: '$CI_PROJECT_URL/-/raw/$CI_COMMIT_TAG/scripts/deploy.sh?inline=false'
          link_type: 'package'
